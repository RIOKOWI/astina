name: astina
description: "ASTINA Smart Mobile - Aplikasi Warga RT 005"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  skeletonizer: ^2.1.3
  flutter_dotenv: ^5.1.0
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  url_launcher: ^6.3.1
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  file_picker: ^8.1.6
  flutter_pdfview: ^1.3.3
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.6
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/img/

flutter_launcher_icons:
  image_path: "assets/img/claymorph-logo-rt.png"
  android: true
  ios: true
  adaptive_icon_background: "#008DFF"
  adaptive_icon_foreground: "assets/img/claymorph-logo-rt.png"
